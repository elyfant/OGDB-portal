services:
  postgres:
    image: postgis/postgis:17-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Bound to the VM's own loopback ONLY (127.0.0.1, not 0.0.0.0) —
      # never reachable over the network. Only usable from a process
      # already running on the VM, or via an SSH tunnel, which requires
      # SSH access you already have. Safe to leave permanently; this is
      # not the same as publishing a port to the network.
      - "127.0.0.1:5432:5432"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    # No `ports:` — only the dashboard container calls this, over the
    # internal Docker network (service name `gateway`).

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    environment:
      API_URL: http://gateway:3001
      PORT: 3000
      # false only while running Phase 1 (plain HTTP, no domain yet) —
      # a Secure cookie is silently dropped by the browser over HTTP.
      # Defaults to true (safe) once behind Caddy/HTTPS in Phase 2.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      - gateway
    # No `ports:` — Caddy is the only public-facing service.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
